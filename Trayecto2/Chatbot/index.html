<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot · Trayecto 2</title>
  <!-- Tailwind CSS por CDN (suficiente para aprendizaje, no requiere instalación) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="h-full bg-slate-100 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-100">

  <div class="mx-auto flex h-full max-w-3xl flex-col sm:py-6">
    <main class="flex min-h-0 flex-1 flex-col overflow-hidden bg-white shadow-xl ring-1 ring-slate-200 sm:rounded-2xl dark:bg-slate-900 dark:ring-slate-800">

      <!-- ENCABEZADO -->
      <header class="flex items-center gap-3 border-b border-slate-200 px-5 py-4 dark:border-slate-800">
        <div class="flex size-10 items-center justify-center rounded-full bg-indigo-600 text-white">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true">
            <rect x="4" y="8" width="16" height="11" rx="3" />
            <path d="M12 8V4M9 13v1.5M15 13v1.5" />
            <circle cx="12" cy="3.5" r="1" />
          </svg>
        </div>
        <div class="min-w-0 flex-1">
          <h1 class="truncate text-base font-semibold">Chatbot</h1>
          <p class="flex items-center gap-1.5 text-xs text-slate-500 dark:text-slate-400">
            <span class="size-2 rounded-full bg-emerald-500"></span> En línea
          </p>
        </div>
        <button id="btn-limpiar" type="button"
          class="rounded-lg px-3 py-1.5 text-sm text-slate-500 transition hover:bg-slate-100 hover:text-slate-800 focus-visible:outline-2 focus-visible:outline-indigo-600 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100">
          Limpiar chat
        </button>
      </header>

      <!-- ZONA DE MENSAJES: aquí se van agregando las burbujas -->
      <section id="mensajes" aria-live="polite"
        class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto px-5 py-6">

        <!-- Estado vacío: se oculta al enviar el primer mensaje -->
        <div id="estado-vacio" class="m-auto max-w-sm text-center">
          <h2 class="text-lg font-semibold">¡Hola! ¿En qué puedo ayudarte?</h2>
          <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
            Escribe un mensaje o elige una sugerencia para empezar.
          </p>
          <div class="mt-5 flex flex-wrap justify-center gap-2">
            <button type="button" class="sugerencia rounded-full border border-slate-300 px-4 py-1.5 text-sm transition hover:border-indigo-600 hover:text-indigo-600 dark:border-slate-700 dark:hover:border-indigo-400 dark:hover:text-indigo-400">Hola</button>
            <button type="button" class="sugerencia rounded-full border border-slate-300 px-4 py-1.5 text-sm transition hover:border-indigo-600 hover:text-indigo-600 dark:border-slate-700 dark:hover:border-indigo-400 dark:hover:text-indigo-400">¿Qué puedes hacer?</button>
            <button type="button" class="sugerencia rounded-full border border-slate-300 px-4 py-1.5 text-sm transition hover:border-indigo-600 hover:text-indigo-600 dark:border-slate-700 dark:hover:border-indigo-400 dark:hover:text-indigo-400">Ayuda</button>
          </div>
        </div>
      </section>

      <!-- CAJA DE TEXTO -->
      <form id="formulario" class="flex items-end gap-2 border-t border-slate-200 p-4 dark:border-slate-800">
        <label for="entrada" class="sr-only">Escribe tu mensaje</label>
        <textarea id="entrada" rows="1" placeholder="Escribe tu mensaje…" autocomplete="off"
          class="max-h-40 min-h-11 flex-1 resize-none rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-600 focus:bg-white dark:border-slate-700 dark:bg-slate-800 dark:focus:border-indigo-400 dark:focus:bg-slate-800"></textarea>
        <button id="btn-enviar" type="submit" aria-label="Enviar mensaje"
          class="flex size-11 shrink-0 items-center justify-center rounded-xl bg-indigo-600 text-white transition hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:cursor-not-allowed disabled:opacity-40">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5" aria-hidden="true">
            <path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z" />
          </svg>
        </button>
      </form>
    </main>

    <p class="hidden py-3 text-center text-xs text-slate-400 sm:block">
      Proyecto de aprendizaje · IA Generativa · Trayecto 2
    </p>
  </div>

  <!-- 1) Tu lógica y reglas del chatbot  2) El código que mueve la interfaz -->
  <script src="js/chatbot.js"></script>
  <script src="js/interfaz.js"></script>
</body>
</html>
